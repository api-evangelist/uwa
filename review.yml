      Elsevier's Pure Web Service contract (info.title "Pure Web Service 524",
      info.contact.name "Elsevier") credited to UWA, plus 92 artifacts derived from it. The
      Pure repository and Ex Libris Primo VE discovery layer are now recorded as
      x-operator tenant relationships rather than UWA contracts. This lowers UWA's score,
      correctly — the score it carried was Elsevier's.
