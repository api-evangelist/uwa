      - type: Signup
        url: https://api-portal.uwa.edu.au/signup
  - aid: uwa:research-repository
    name: UWA Profiles and Research Repository (Pure CRIS Web Service)
    description: >-
      Elsevier Pure CRIS Web Service backing the UWA Profiles and Research
      Repository, exposing research outputs, persons, organisations, projects,
      activities, and applications as REST resources. Access requires an API key
      generated in the Pure administrator interface; the versioned web service
      (5.24 / "524") publishes interactive API documentation.
    humanURL: https://api.research-repository.uwa.edu.au/ws/api/524/api-docs/documentation/Default.htm
