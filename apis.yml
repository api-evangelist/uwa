- aid: uwa:research-repository
  name: UWA Profiles and Research Repository (Elsevier Pure tenancy)
  x-operator: tenant
  description: >-
    UWA's research information system and public research portal, running on Elsevier Pure at
    research-repository.uwa.edu.au with a CRIS web service at
    api.research-repository.uwa.edu.au/ws/api/524. The data is UWA's — its researchers, outputs,
    projects, datasets and DOIs — and the repository is a genuine UWA service. The contract is not
    UWA's: the OpenAPI served there declares info.title "Pure Web Service 524" and
    info.contact.name "Elsevier", and it is the same product contract every Pure customer receives.
    It is recorded here as a tenant relationship only. The spec, and the 28 per-tag OpenAPIs and
    every schema, example, collection, ruleset, vocabulary and capability map that had been derived
    from it, were removed from this repo on 2026-08-30 — they were Elsevier's engineering credited
    to UWA. Access requires a Pure API key issued from the Pure Administrator tab.
  humanURL: https://research-repository.uwa.edu.au/
