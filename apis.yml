name: University of Western Australia
x-type: university
x-category: Public Research University
description: >-
  The University of Western Australia (UWA) is a public research university in Perth, Western
  Australia, a member of the Group of Eight, and ranked in the top 100 of the QS World University
  Rankings. Its programmable footprint is small, and most of what appears to be a UWA API is not:
  the research repository at research-repository.uwa.edu.au runs on Elsevier Pure and its
  /ws/api/524 web service is Elsevier's contract, and library discovery at
  onesearch.library.uwa.edu.au is Ex Libris Primo VE under tenant 61UWA_INST. Both are real UWA
  services and neither is UWA engineering. What UWA genuinely operates and exposes is narrower and
  more interesting: a fully open, unauthenticated OAI-PMH 2.0 harvesting endpoint at
  api.research-repository.uwa.edu.au/ws/oai serving 167 sets across five metadata formats with no
  key required, and a Shibboleth SAML 2.0 identity provider publishing signed federation metadata
  at idp.uwa.edu.au/idp/shibboleth. UWA also runs a Microsoft Azure API Management estate — a
  developer portal at api-portal.uwa.edu.au and a live gateway at api.uwa.edu.au — but the product
  catalog sits behind sign-in and the portal's own signup path returns 404, so nothing there is
  publicly enumerable. No open data portal, no public course or timetable API, and no first-party
  OpenAPI of any kind was found.
