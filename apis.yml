apis:
- aid: uwa:oai-pmh
  name: UWA Research Repository OAI-PMH
  x-operator: institution
  description: >-
    An open, unauthenticated OAI-PMH 2.0 metadata harvesting endpoint operated by UWA on its own
    host. All six protocol verbs returned 200 on 2026-08-30 with no credential presented. Identify
    reports adminEmail help-repository@uwa.edu.au and an earliestDatestamp of 2014-08-20;
    ListMetadataFormats advertises oai_dc, qdc, mods, xmetadiss and nl_didl; ListSets enumerates
    167 sets covering persons, publications by year from 1946 to 2026, datasets, and an openaire
    set, with every response schema-located against the OpenAIRE CERIF 1.2 profile. The repository
    software underneath is Elsevier Pure, but OAI-PMH is an open standard rather than a vendor
    contract, the host is UWA's own registrable domain, and the administrative contact is a UWA
    address — so this is recorded as institution-operated. It is the only UWA API surface anyone
    can call today without an account.
