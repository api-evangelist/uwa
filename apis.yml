    Re-profiled under the university pipeline's operator axis. The June 2026 profile carried 29
    apis[] entries, 28 of which were per-tag splits of a single Elsevier Pure Web Service contract
    that had additionally been mis-based onto the Azure portal host in apis.yml. Those 28 entries,
    the 28 refined OpenAPIs, the pristine source spec and all 92 artifacts derived from it were
    removed. Two genuinely institution-operated surfaces were found and added: an open OAI-PMH 2.0
    endpoint and a Shibboleth SAML 2.0 identity provider. This correction is expected to lower
    UWA's Kin Score, because the score it previously carried was Elsevier's.
