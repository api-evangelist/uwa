---
aid: uwa
name: University of Western Australia
description: >-
  The University of Western Australia (UWA) is a public research university in
  Perth, Western Australia, and ranked #80 in the QS World University Rankings
  2025. Its public developer/API footprint is modest and primarily institutional:
  UWA operates an Azure API Management developer portal where APIs and products
  are published and consumed via API keys behind a sign-in, and exposes an
  Elsevier Pure CRIS Web Service for its Profiles and Research Repository that
  returns research outputs, people, projects, and related metadata via an
  API-key-protected REST interface. Most other interfaces are gated behind
  institutional affiliation or federated identity rather than open self-service.
