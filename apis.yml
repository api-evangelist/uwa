- aid: uwa:identity-federation
  name: UWA Shibboleth Identity Provider (SAML 2.0 metadata)
  x-operator: institution
  description: >-
    UWA operates its own Shibboleth identity provider and publishes signed SAML 2.0 federation
    metadata at https://idp.uwa.edu.au/idp/shibboleth (200, 5,081 bytes). The document is an
    EntityDescriptor with entityID https://idp.uwa.edu.au/idp/shibboleth, an IDPSSODescriptor
    supporting urn:oasis:names:tc:SAML:2.0:protocol, signing and encryption key descriptors
    (uwa-prod-signing-cert, CN=idp.uwa.edu.au), a shibmd:Scope of uwa.edu.au, transient NameID, and
    SingleSignOnService bindings for both HTTP-POST and HTTP-Redirect. Institution-operated by
    definition, machine-readable, and the credential behind essentially every affiliation-gated UWA
    service. This is the surface class universities genuinely run and almost never catalogue.
  humanURL: https://idp.uwa.edu.au/idp/shibboleth
  baseURL: https://idp.uwa.edu.au/idp
