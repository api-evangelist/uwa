apis:
  - aid: uwa:developer-portal
    name: UWA Developer Portal (Azure API Management)
    description: >-
      UWA's developer portal, built on Microsoft Azure API Management, where
      published APIs and products can be discovered, tried interactively, and
      subscribed to for API keys. The catalog of products and APIs is presented
      behind a JavaScript app and sign-in, so individual endpoints are not
      publicly enumerable without an account.
    humanURL: https://api-portal.uwa.edu.au/
    baseURL: https://api-portal.uwa.edu.au/
