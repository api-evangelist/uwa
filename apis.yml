- aid: uwa:developer-portal
  name: UWA API Gateway and Developer Portal (Azure API Management)
  x-operator: institution
  description: >-
    UWA runs a Microsoft Azure API Management estate on its own domains. The developer portal at
    api-portal.uwa.edu.au returns 200 but serves the stock unbranded Azure APIM shell — title "Home
    - Microsoft Azure API Management - developer portal" — with the product and API catalog behind
    sign-in, and its documented /signup path returns 404. The runtime gateway at api.uwa.edu.au is
    live: a bare GET answers HTTP/2 404 with content-type application/json and an Azure
    request-context header, which is APIM's no-matching-operation response. So UWA demonstrably
    operates an API gateway; it publishes nothing about what runs on it. No OpenAPI, no product
    list, and no endpoint is enumerable without an account.
  humanURL: https://api-portal.uwa.edu.au/
